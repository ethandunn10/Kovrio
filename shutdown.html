<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kovrio has shut down</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafaf7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
  .card{max-width:480px;text-align:center}
  h1{font-size:32px;margin:0 0 16px}
  p{font-size:17px;line-height:1.6;color:#444;margin:0 0 12px}
  .rilo{margin-top:32px;padding:20px;border-radius:14px;background:#fff;border:1px solid #e6e6e0}
  .rilo p{margin:0 0 14px;color:#222}
  .btn{display:inline-block;background:#111;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600;font-size:16px}
  .small{font-size:14px;color:#888;margin-top:24px}
</style>
</head>
<body>
  <div class="card">
    <h1>Kovrio has shut down</h1>
    <p>Thanks to everyone who used Kovrio to study for their AP exams.</p>
    <p>The site is closed, and all accounts and data have been permanently deleted.</p>
    <div class="rilo">
      <p><strong>What I'm building next: Rilo</strong><br>A buddy that helps you spend less time on your phone.</p>
      <a class="btn" href="https://rilo.one/#waitlist">Join the Rilo waitlist</a>
    </div>
    <p class="small">Built by Ethan Dunn</p>
  </div>
</body>
</html>
